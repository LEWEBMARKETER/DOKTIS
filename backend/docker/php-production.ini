; Réglages PHP de production pour l'API DOKTIS.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change pas dans un conteneur : pas de vérification des fichiers.
opcache.validate_timestamps = 0
